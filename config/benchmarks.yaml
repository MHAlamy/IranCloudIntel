# Reference sizes and matching rules for VM comparison (price_gathering_guide.md 6.2-6.4).
# CPU/RAM values are owner requirements; disk targets are proposed defaults
# (kept configurable). Canonical display unit: monthly Toman.

vm:
  monthly_hours: 730          # configurable standardization for hourly-only quotes
  default_region_scope: iran
  default_os: linux
  sizes:
    small:      {vcpu: 1,  ram_gb: 2,  disk_gb: 20}
    medium:     {vcpu: 4,  ram_gb: 8,  disk_gb: 80}
    large:      {vcpu: 16, ram_gb: 32, disk_gb: 320}
    very_large: {vcpu: 32, ram_gb: 64, disk_gb: 640}
  matching:
    require_exact_cpu_ram_for_primary_ranking: true
    allow_disk_difference: true
    show_approximate_matches_separately: true
  ipv4:
    include_in_cost: false   # owner decision 2026-11-15: base price only for now; IPv4 toggle comes later
  regions:
    scope: iran              # compare Iranian regions only (owner decision 2026-11-15)
    iranian_prefix: ir-      # regions whose code starts with this are treated as Iranian

# Object Storage benchmarks (price_gathering_guide.md 7). Owner decision
# (2026-11-15): the comparison baseline is Hamravesh's published plans — each
# scenario is one Hamravesh plan's included capacity. Providers without an
# exactly matching bundle get a price calculated from their documented PAYG
# rates. Request charges are excluded from scenarios because Hamravesh
# publishes no request allowance (unknown ≠ zero).
object_storage:
  tb_to_gb: 1024             # provider pages say ترابایت; conversion is explicit here
  baseline: hamravesh
  # `requests` is an analyst estimate of monthly API calls per scenario. It is
  # only charged where the provider bills requests separately (Sotoon HiCap).
  # The estimate assumes large objects (~4 MiB average), so it is deliberately
  # at the low end: underestimating the request cost is preferred.
  scenarios:
    base:       {label: پایه,    storage_gb: 100,    traffic_gb: 400,    requests: 100000}
    growth:     {label: رشد,     storage_gb: 500,    traffic_gb: 2048,   requests: 500000}
    pro:        {label: حرفه‌ای, storage_gb: 5120,   traffic_gb: 20480,  requests: 5000000}
    dedicated:  {label: اختصاصی, storage_gb: 51200,  traffic_gb: 204800, requests: 50000000}

  # Sotoon does not bill Object Storage egress for traffic served through its
  # own CDN (owner decision 2026-11-17). The dashboard shows both the full
  # traffic price and a CDN-assisted price that charges only the remaining
  # share; the CDN's own traffic tariff is a separate product and is not added.
  traffic_offloads:
    sotoon:
      cdn_share: 0.8

# PaaS/CNAP compute references. CPU/RAM are owner requirements (2026-11-16).
# SSD follows Liara silver's published plans (20/80/320 GB); the 640 GB value
# for the 32/64 reference is the same doubling pattern because Liara does not
# offer that size. The dashboard shows the actual SSD with every selection.
paas:
  liara_tier: "نقره‌ای"
  selections:
    s1: {vcpu: 1,  ram_gb: 2,  disk_gb: 20}
    s2: {vcpu: 4,  ram_gb: 8,  disk_gb: 80}
    s3: {vcpu: 16, ram_gb: 32, disk_gb: 320}
    s4: {vcpu: 32, ram_gb: 64, disk_gb: 640}
