# Analyst-maintained normalized VM performance tiers (price_gathering_guide.md 6.1).
# Initial qualitative mapping, NOT verified benchmarks. Changes are versioned in Git
# and must not rewrite raw price history.

vm:
  tiers: [economy, standard, premium]
  providers:
    arvan:
      aliases:
        basic: economy
        economy: economy
        standard: standard
        premium: premium
        premium_plus: premium
      unknown_label_policy: review   # unexpected Arvan labels go to analyst review
    # Owner decision 2026-11-15: Liara and ParsPack offerings are treated as
    # cost-oriented and compared under Economy instead of Standard. Their
    # stored provider_tier_raw values are unchanged; only this mapping moved.
    liara: {default: economy}
    parspack: {default: economy}
    cloud_ir: {default: standard}
