# Source registry (price_gathering_guide.md 4.1).
# URLs are verified starting points; only sources confirmed to exist are enabled.
# No credentials may ever be stored in this file.

providers:
  - slug: arvan
    name: ArvanCloud
    official_url: https://www.arvancloud.ir/
    sources:
      - id: arvan_vm_cloud_server
        service_type: vm
        url: https://www.arvancloud.ir/fa/pricing/cloud-server
        collection_method: playwright   # JS challenge + dynamic tabs
        region_scope: iran
        enabled: true
        navigation:
          ready_marker: "eco-small"     # text that proves real content rendered
          tabs: [basic, standard, premium]
      - id: arvan_object_storage
        service_type: object_storage
        url: https://www.arvancloud.ir/fa/pricing/cloud-storage
        collection_method: playwright   # JS challenge (same as the VM page)
        region_scope: iran
        enabled: true
        navigation:
          ready_marker: "مصرف مازاد"    # proves the PAYG section rendered
          llm_plan_extraction: true     # plan cards via LLM; PAYG tables parsed deterministically

  - slug: hamravesh
    name: Hamravesh
    official_url: https://hamravesh.com/
    sources:
      - id: hamravesh_object_storage
        service_type: object_storage
        url: https://hamravesh.com/pricing?service=object_storage
        collection_method: playwright   # pricing data loads client-side per service tab
        region_scope: iran
        enabled: true
        navigation:
          click_text: "آبجکت استورج"    # menu item that switches the pricing table
          click_selector: 'li.ant-menu-item:has-text("آبجکت استورج")'
          ready_marker: "هر GB فضای اضافه"   # proves the OS table rendered
          llm_plan_extraction: false    # clean attribute matrix -> deterministic parser

  - slug: liara
    name: Liara
    official_url: https://liara.ir/
    sources:
      - id: liara_vm_cloud_server
        service_type: vm
        url: https://liara.ir/products/cloud-server/
        collection_method: http   # static page (was unreachable 2026-11-15, restored)
        region_scope: iran
        enabled: true
        navigation:
          tabs: [plans]
          bundle_extraction: false   # deterministic plan parsing, no LLM

  - slug: parspack
    name: ParsPack
    official_url: https://parspack.com/
    sources:
      - id: parspack_vm_quotes
        service_type: vm
        url: https://parspack.com/cloud-server
        collection_method: playwright   # interactive calculator quotes
        region_scope: iran
        enabled: true
        navigation:
          bundle_extraction: false
      - id: parspack_object_storage
        service_type: object_storage
        url: https://parspack.com/cloud-storage
        collection_method: playwright   # interactive calculator quotes
        region_scope: iran
        enabled: true
        navigation:
          bundle_extraction: false      # quote calculator, not published bundles

  - slug: kubit
    name: Kubit
    official_url: https://kubit.cloud/
    sources:
      - id: kubit_vm_pricing
        service_type: vm
        url: https://kubit.cloud/fa/pricing
        collection_method: http   # static page, no challenge
        region_scope: iran
        enabled: true
        navigation:
          tabs: [rates]
          bundle_extraction: false   # rate-table-only provider (no published VM bundles)
      - id: kubit_object_storage
        service_type: object_storage
        url: https://kubit.cloud/fa/pricing/
        collection_method: http   # static page, no challenge
        region_scope: iran
        enabled: true
        navigation:
          bundle_extraction: false   # free base plan + PAYG tables -> deterministic parser
