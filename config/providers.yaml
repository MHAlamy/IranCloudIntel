# Source registry (price_gathering_guide.md 4.1).
# URLs are verified starting points; only sources confirmed to exist are enabled.
# No credentials may ever be stored in this file.

providers:
  - slug: arvan
    name: ArvanCloud
    official_url: https://www.arvancloud.ir/
    sources:
      - id: arvan_vm_cloud_server
        service_type: vm
        url: https://www.arvancloud.ir/fa/pricing/cloud-server
        collection_method: playwright   # JS challenge + dynamic tabs
        region_scope: iran
        enabled: true
        navigation:
          ready_marker: "eco-small"     # text that proves real content rendered
          tabs: [basic, standard, premium]

  - slug: liara
    name: Liara
    official_url: https://liara.ir/
    sources: []   # pricing page pending verification (price_gathering_guide.md 4)

  - slug: parspack
    name: ParsPack
    official_url: https://parspack.com/
    sources:
      - id: parspack_vm_quotes
        service_type: vm
        url: https://parspack.com/cloud-server
        collection_method: playwright   # interactive calculator quotes
        region_scope: iran
        enabled: true
        navigation:
          bundle_extraction: false

  - slug: cloud_ir
    name: Cloud.ir
    official_url: https://cloud.ir/
    sources: []   # regional tariffs pending verification

  - slug: kubit
    name: Kubit
    official_url: https://kubit.cloud/
    sources:
      - id: kubit_vm_pricing
        service_type: vm
        url: https://kubit.cloud/fa/pricing
        collection_method: http   # static page, no challenge
        region_scope: iran
        enabled: true
        navigation:
          tabs: [rates]
          bundle_extraction: false   # rate-table-only provider (no published VM bundles)
