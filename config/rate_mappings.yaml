# Provider family → rate-class mapping for bundle verification and calculated
# prices. Empirically verified on 2026-11-15 against all Iranian-region
# bundles (14/14 exact). This mapping is analyst-maintained: it is derived from
# observed prices, not documented by the provider — review on any mismatch.
#
# bundle = ipv4_first + compute_factor * (vcpu * cpu_rate + ram * ram_rate)
#          + disk * storage_rate

arvan:
  ipv4_first_toman: "234000"
  default_storage_rate_toman: "18000"   # بلاک استوریج (Eco) == (Hot-SSD)
  families:
    - prefix: "eco"
      rate_tier: basic
      compute_factor: "0.7"             # empirically discounted; may be a promotion
      storage_class: eco
    - prefix: "g1"
      rate_tier: basic
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "ls1"
      rate_tier: basic
      compute_factor: "1.0"
      storage_class: local              # بلاک استوریج (Local)
    - prefix: "g3"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "g4.5"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "g4"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "g6.5"
      rate_tier: premium
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "g6"
      rate_tier: standard               # yes: premium-tab g6-small* price at standard rates
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "m6"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "c6"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "c5"
      rate_tier: premium
      compute_factor: "1.0"
      storage_class: eco
    - prefix: "c2"
      rate_tier: standard
      compute_factor: "1.0"
      storage_class: eco
  calculated_price_factors:             # for sizes without an existing bundle
    economy: "0.7"
    standard: "1.0"
    premium: "1.0"
  calculated_notes: >-
    Calculated prices use the tier's published PAYG rates; the economy factor
    matches the empirically-observed eco-family discount and is an assumption.

# Kubit publishes pure component rates (no VM bundles at all): every price the
# dashboard shows is calculated. Owner decisions 2026-11-15: gen-3 → Economy,
# gen-4 → Standard, no premium; IPv4 (internet) included in the calculated
# baseline; VAT and traffic out of comparison scope. Factor is 1.0 — the
# published rates are used as-is.
kubit:
  ipv4_first_toman: "173000"          # آی‌پی اینترنتی IPv4 (monthly)
  default_storage_rate_toman: "14900"
  families: []                        # no published bundles to verify
  tier_generations:
    economy: "gen-3"
    standard: "gen-4"
  calculated_price_factors:
    economy: "1.0"
    standard: "1.0"
    premium: "1.0"
  calculated_notes: >-
    All Kubit prices are calculated from its published per-component rates
    (CPU/RAM by generation, disk, internet IPv4). No bundle discount exists.
